name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint and unit tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cpu.txt

      - name: Install CPU PyTorch
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install application and lint dependencies
        run: |
          python -m pip install -r requirements-cpu.txt ruff==0.11.13
          python -m pip check

      - name: Lint
        run: ruff check app tests

      - name: Run tests
        run: python -m pytest tests/ -v

  docker:
    name: Build and smoke-test CPU image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CPU Docker image
        run: docker build --tag brain-tumor-segmentation:ci .

      - name: Smoke-test API import inside container
        run: docker run --rm brain-tumor-segmentation:ci python -c "import app.main; print('Docker API import OK')"

      - name: Validate Compose configuration
        run: docker compose config --quiet
