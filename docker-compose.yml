services:
  brain-tumor-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./predictions:/app/predictions
    restart: unless-stopped
    # Model loading requires pretrained and fine-tuned weights in ./models.
    # Keep the API bound to localhost; do not expose medical uploads publicly.
